<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Тренажёр переписки — чат</title>
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="page-chat">
  <header class="topbar">
    <div class="brand">
      <div class="logo">💬</div>
      <div>
        <div class="title">Тренажёр переписки</div>
        <div class="subtitle">Рабочий чат с клиентом</div>
      </div>
    </div>

    <div class="controls">
      <button id="endBtn" class="btn btn-ghost" type="button">Завершить диалог</button>
    </div>
  </header>

  <main class="layout" style="grid-template-columns: 1fr; max-width: 980px;">
    <section class="card chatCard">
      <div class="cardHead">
        <div class="hgroup chatTitle">
          <h2>Диалог с клиентом</h2>
          <div class="meta">Рабочая переписка</div>
          <span id="scenarioTitle" class="srOnly">Сценарий</span>
          <span id="scenarioMeta" class="srOnly"></span>
        </div>
        <div class="status">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">Готово</span>
        </div>
      </div>

      <div id="chat" class="chat" aria-live="polite" aria-label="Чат"></div>

      <div class="composer">
        <textarea id="input" placeholder="Напишите сообщение клиенту…" rows="3"></textarea>
        <div class="composerRow">
          <div class="hint" id="hintText"></div>
          <button id="sendBtn" class="btn" type="button">Отправить</button>
        </div>
      </div>
    </section>
  </main>

  <div id="fioModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modalCard">
      <h3 class="h3" style="margin-top:0;">Введите ФИО менеджера</h3>
      <div class="form">
        <label class="field">
          <span>ФИО</span>
          <input id="mgrName" type="text" placeholder="Иванов Иван Иванович" />
        </label>
      </div>
      <div class="row" style="justify-content:flex-end; gap:10px; padding:0;">
        <button id="mgrOk" class="btn" type="button">Начать</button>
      </div>
      <div class="small">ФИО сохранится для этой сессии.</div>
    </div>
  </div>

  <div id="scoreModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modalCard">
      <h3 class="h3" style="margin-top:0;">Оценка диалога</h3>
      <div class="row" style="justify-content:space-between; padding:0;">
        <div class="pill">Итог: <span id="scoreValue">—</span></div>
        <button id="scoreClose" class="btn btn-ghost" type="button">Закрыть</button>
      </div>
      <div id="checklist" class="checklist" ></div>
      <div class="small">Результат отправлен. Если отправка не удалась — будет скачан JSON.</div>
    </div>
  </div>

  <script src="./app.js?v=15"></script>
</body>
</html>
